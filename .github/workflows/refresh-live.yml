name: Refresh live data

# Daily refresh of the near-real-time layers the app shows next to the harmonized history:
#   live.json           FIRMS NRT, NOAA-20/21 VIIRS + MODIS, last 24 h / 7 d  (keyless)
#   eonet.json          NASA EONET open wildfire events                     (keyless)
#   tle.json            orbital elements for the five fire satellites        (keyless)
#   month_to_date.json  FIRMS area API, current month vs history            (needs FIRMS_MAP_KEY)
#   month_to_date_cells.json  the same responses per H3 res-4 cell (drawn areas)
# The fitted tables are never touched here. The manifest is rebuilt so its hashes match.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: python -m pip install --quiet "polars>=1.0" "shapely>=2.0" "h3>=4"

      - name: Live fires (FIRMS NRT, keyless)
        continue-on-error: true
        run: python scripts/build_live.py

      - name: EONET wildfire events
        continue-on-error: true
        run: python scripts/build_eonet.py

      - name: Satellite orbital elements
        continue-on-error: true
        run: python scripts/build_tle.py

      - name: Month to date (FIRMS area API)
        if: env.FIRMS_MAP_KEY != ''
        continue-on-error: true
        # Responses are cached under data/mtd_cache/ during the run; a chunk that still fails after
        # retries marks its country "incomplete" (listed in the file) instead of stopping the run.
        run: python scripts/build_month_to_date.py

      - name: Month to date per grid cell (from the cached responses, no new requests)
        if: env.FIRMS_MAP_KEY != ''
        continue-on-error: true
        run: python scripts/build_month_to_date_cells.py

      - name: Note missing FIRMS key
        if: env.FIRMS_MAP_KEY == ''
        run: echo "::warning::FIRMS_MAP_KEY secret is not set; month_to_date.json was not refreshed."

      - name: Rebuild manifest and verify the data contract
        run: |
          python scripts/build_manifest.py
          python scripts/check_data_contract.py

      - name: Commit changed files
        if: github.ref == 'refs/heads/main'
        run: |
          files="web/public/data/live.json web/public/data/eonet.json web/public/data/tle.json web/public/data/month_to_date.json web/public/data/month_to_date_cells.json web/public/data/manifest.json"
          if git diff --quiet -- $files; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $files
          git commit -m "Refresh live data"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
