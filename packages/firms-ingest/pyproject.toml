[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firms-ingest"
version = "0.1.0"
description = "Normalize, filter, cluster and grid NASA FIRMS active-fire detections across MODIS and VIIRS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["nasa", "firms", "wildfire", "modis", "viirs", "remote-sensing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "polars>=1.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
cluster = ["scikit-learn>=1.3"]
grid = ["h3>=4.0"]
nrt = ["httpx>=0.27"]
all = ["scikit-learn>=1.3", "h3>=4.0", "httpx>=0.27"]
dev = ["pytest>=8.0", "scikit-learn>=1.3", "h3>=4.0", "httpx>=0.27"]

[project.scripts]
firms-ingest = "firms_ingest.cli:main"

[project.urls]
Homepage = "https://github.com/shishirbhat/NASA-SPACE-APPS-MODULARK"

[tool.hatch.build.targets.wheel]
packages = ["src/firms_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
